name: Keep Render Awake

on:
  schedule:
    # 每14分钟 ping 一次（Render 免费版 15 分钟无流量会休眠）
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend to prevent cold start..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 60 "https://stock-analyzer-app-1-j7jd.onrender.com/health")
          echo "Health check response: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Render backend is awake!"
          else
            echo "⚠️ Render backend returned $HTTP_CODE (may be starting up)"
          fi
