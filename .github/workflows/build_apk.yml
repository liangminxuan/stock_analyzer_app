name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Clean and Fix Gradle
        run: |
          rm -rf android/.gradle
          rm -rf ~/.gradle
          chmod +x android/gradlew
          # 修复 gradle wrapper 权限
          find android -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: |
          # 使用 flutter 自带的 gradle 处理
          export GRADLE_OPTS="-Dorg.gradle.daemon=false"
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/apk/release/app-release.apk
