name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Fix Gradle Wrapper
        run: |
          # Remove cached gradle
          rm -rf ~/.gradle
          rm -rf android/.gradle
          # Make gradlew executable
          chmod +x android/gradlew
          # Fix gradle binary permissions in wrapper
          find ~/.gradle -name "gradle" -type f -exec chmod +x {} \; 2>/dev/null || true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build APK
        run: |
          cd android
          # Download gradle wrapper if needed
          ./gradlew --version || true
          cd ..
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/apk/release/app-release.apk
