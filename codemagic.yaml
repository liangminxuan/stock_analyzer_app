workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: 3.16.0
      java: 17
      env:
        CM_REPO_URL: https://github.com/liangminxuan/stock_analyzer_app
    scripts:
      - name: Get dependencies
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
      - name: Publish to GitHub Releases
        script: |
          # 获取 APK 文件
          APK_PATH=$(find build -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          
          # 创建 GitHub Release
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          TAG_NAME="v1.0.0-$TIMESTAMP"
          
          curl --noproxy '*' -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -d "{\"tag_name\":\"$TAG_NAME\",\"name\":\"Stock Analyzer $TAG_NAME\",\"body\":\"Automated build from Codemagic\",\"draft\":false,\"prerelease\":false}" \
            "https://api.github.com/repos/liangminxuan/stock_analyzer_app/releases"
    artifacts:
      - build/**/outputs/**/*.apk
